<title>Spiti</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: drafting board. Tool rail left, drawing in the middle, properties sheet right (bottom on phones). */
:root{
  --paper:#f3f5f4; --sheet:#ffffff; --ink:#1d2326; --ink-2:#55605f; --line:#d5dbd9;
  --accent:#1f5f8b; --accent-soft:#e2edf5; --sub:#b4432f; --ok:#2f7a4f; --warn:#a46a10;
  --fill:#e9eef0; --grid:#e3e8e7; --grid-major:#cfd7d5; --furn:#6b7674; --col:#2b3134; --wall:#9ea8a6; --topo:#b06a1f; --ins:#e8c04a; --clad:#b98a5a; --fill-v:#dde3e5; --fill-e:#e1efe5;
  --font:"Commissioner",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#161a1c; --sheet:#1e2326; --ink:#e4e9e8; --ink-2:#9aa6a4; --line:#333b3e;
  --accent:#6fb0dd; --accent-soft:#1f3442; --sub:#e3826d; --ok:#6cc392; --warn:#e2ae55;
  --fill:#232a2d; --grid:#20272a; --grid-major:#2c3539; --furn:#93a09e; --col:#cfd6d5; --wall:#56615f; --topo:#e0a058; --ins:#b8932a; --clad:#9a7149; --fill-v:#2c3538; --fill-e:#1f3027; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#161a1c; --sheet:#1e2326; --ink:#e4e9e8; --ink-2:#9aa6a4; --line:#333b3e;
  --accent:#6fb0dd; --accent-soft:#1f3442; --sub:#e3826d; --ok:#6cc392; --warn:#e2ae55;
  --fill:#232a2d; --grid:#20272a; --grid-major:#2c3539; --furn:#93a09e; --col:#cfd6d5; --wall:#56615f; --topo:#e0a058; --ins:#b8932a; --clad:#9a7149; --fill-v:#2c3538; --fill-e:#1f3027; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;overflow:hidden}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
#app{height:100%;display:grid;grid-template-rows:auto 1fr;grid-template-columns:88px 1fr 320px;
  grid-template-areas:"top top top" "rail board side";
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
header{grid-area:top;display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--sheet);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.02em;display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.brand small{font-weight:500;color:var(--ink-2);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
#planName{flex:1 1 90px;min-width:0;max-width:240px;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:7px 10px}
.stat{font-family:var(--mono);font-size:13px;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.stat b{color:var(--ink);font-weight:600}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:8px 12px;min-height:40px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,.tool:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--sheet);font-weight:600}
.btn.danger{color:var(--sub);border-color:color-mix(in srgb,var(--sub) 45%,var(--line))}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
nav#rail{grid-area:rail;background:var(--sheet);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:8px 6px;overflow-y:auto}
.tool{border:1px solid transparent;background:none;border-radius:10px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font-size:12px;line-height:1.15;text-align:center;color:var(--ink)}
.tool svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:1.6}
.tool:hover{background:var(--paper)}
.tool.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.rail-sep{height:1px;background:var(--line);margin:4px 6px}
main#board{grid-area:board;position:relative;min-width:0;min-height:0;overflow:hidden;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
.float{position:absolute;display:flex;gap:6px}
#zoomBox{right:12px;bottom:12px}
#zoomBox .btn{min-width:44px;background:color-mix(in srgb,var(--sheet) 92%,transparent)}
#hint{left:12px;bottom:12px;font-size:12px;color:var(--ink-2);background:color-mix(in srgb,var(--sheet) 88%,transparent);padding:6px 10px;border-radius:6px;max-width:60%}
aside#side{grid-area:side;background:var(--sheet);border-left:1px solid var(--line);overflow-y:auto;padding:14px 16px 24px;min-width:0}
aside h2{font-size:17px;margin:0 0 4px;text-wrap:balance}
aside p{margin:6px 0;color:var(--ink-2);line-height:1.45;font-size:14px}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
details.grp{border-top:1px solid var(--line);margin:0}
details.grp:last-of-type{border-bottom:1px solid var(--line)}
details.grp>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:12px 2px;font-weight:600;font-size:15px;color:var(--ink);min-height:44px;box-sizing:border-box}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::before{content:'▸';color:var(--ink-2);font-size:12px;width:12px;transition:transform .15s}
details.grp[open]>summary::before{transform:rotate(90deg)}
details.grp>summary span{margin-left:auto;font-weight:400;font-size:12px;color:var(--ink-2);font-family:var(--mono);text-align:right}
details.grp>.grpb{padding:0 0 14px}
.form{display:grid;gap:10px;margin-top:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
label.f{display:grid;gap:4px;font-size:12px;color:var(--ink-2);min-width:0}
label.f input,label.f select{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:9px 10px;font-family:var(--mono);font-size:16px;width:100%;min-width:0;font-variant-numeric:tabular-nums}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.note{font-size:13px;color:var(--ink-2);background:var(--paper);border-radius:8px;padding:8px 10px;line-height:1.4}
.note.warn{color:var(--warn)}
.note.ok{color:var(--ok)}
.lib{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.lib button{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 9px;cursor:pointer;min-height:44px}
.lib button span{display:block;font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.lib button:hover{border-color:var(--accent)}
.sides{display:grid;gap:6px}
.side-row{display:grid;grid-template-columns:28px 1fr 1fr 30px;gap:6px;align-items:end}
.side-row .n{font-family:var(--mono);font-size:13px;color:var(--ink-2);padding-bottom:10px}
.lay-row{display:grid;grid-template-columns:minmax(0,1fr) 62px auto 28px 28px;gap:6px;align-items:center}
.lay-row select,.lay-row input{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:8px;font-size:15px;min-width:0;width:100%}
.lay-row input{font-family:var(--mono);text-align:right}
.lay-row span{font-size:12px;color:var(--ink-2)}
.lay-row button{border:none;background:none;font-size:18px;cursor:pointer;color:var(--ink-2);padding:0}
.lay-row button[data-ld]{color:var(--sub);font-size:20px}
.lay-row button:disabled{opacity:.3}
.chk-row{display:grid;grid-template-columns:1fr 1fr 1.3fr 28px;gap:6px;align-items:end;margin-top:6px}
.chk-row select{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:9px 6px;font-size:16px;min-width:0}
.chk-row button{border:none;background:none;color:var(--sub);font-size:20px;cursor:pointer;padding-bottom:6px}
.chk{display:inline-block;min-width:18px;text-align:center;font-weight:700}
.side-row button{border:none;background:none;color:var(--sub);font-size:20px;cursor:pointer;padding-bottom:6px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:none;background:var(--paper);padding:8px 6px;cursor:pointer;min-height:40px}
.seg button.on{background:var(--accent);color:var(--sheet)}
dl.sum{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:10px 0;font-size:14px}
dl.sum dt{color:var(--ink-2)} dl.sum dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums}
.seg.mode{flex:0 0 auto}
.seg.mode button{padding:8px 14px;font-weight:600}
.tbl{overflow-x:auto;margin:10px 0}
.tbl table{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:600;padding:4px 0;border-bottom:1px solid var(--line)}
.tbl td{padding:6px 0;border-bottom:1px solid var(--line)}
.tbl td:not(:first-child),.tbl th:not(:first-child){text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{color:var(--accent)}
.tbl tr.sub td{text-align:left!important;font-family:var(--font)!important;font-size:12px;color:var(--ink-2);padding-top:0}
.tbl tr.sub + tr td, .tbl tbody tr:has(+ tr.sub) td{border-bottom:none}
.tbl tfoot td{font-weight:600;border-bottom:none}
.tbl tr.nohov{cursor:default}
.tbl tbody tr.nohov:hover td{color:inherit}
.tbl input,.tbl select{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:6px;font-size:15px;font-family:var(--mono);max-width:100%}
.tbl tr.cur td{color:var(--accent);font-weight:600}
.flsel{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 6px;min-height:40px;font-weight:600;max-width:140px}
.segs{display:grid;gap:0;margin:4px 0}
.sgr{display:grid;grid-template-columns:1fr auto auto;gap:4px 8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.sgr b{font-weight:600;font-size:14px}
.sgr span{white-space:nowrap;font-size:14px;color:var(--ink-2)}
.sgr input{width:64px;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:7px;font-size:16px;font-family:var(--mono)}
.sgr select{grid-column:1/-1;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:8px;font-size:15px;min-width:0}
.sgr .btn{min-height:36px;padding:4px 12px}
@media (min-width:821px) and (max-width:1440px){#bUndo .hide-s{display:none}}
.tbl tfoot tr:last-child td{border-top:2px solid var(--ink)}
.layers{display:grid;gap:4px;max-height:180px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin:6px 0;font-size:13px}
.layers label{display:flex;gap:6px;align-items:center;min-width:0}
.layers span{margin-left:auto;color:var(--ink-2);font-family:var(--mono);font-size:11px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:90vw}
#dxfBox{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 45%,transparent);display:grid;place-items:center;z-index:15;padding:16px}
#dxfBox .card{background:var(--sheet);border-radius:12px;padding:16px;width:min(640px,100%);display:grid;gap:10px}
#dxfText{width:100%;height:220px;font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:6px;background:var(--paper);padding:8px}
.kbd{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 4px}
@media (max-width:820px){
  #app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto auto;grid-template-areas:"top" "board" "side" "rail"}
  nav#rail{flex-direction:row;overflow-x:auto;border-right:none;border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px))}
  .tool{min-width:72px}
  .rail-sep{width:1px;height:auto;margin:6px 2px}
  aside#side{border-left:none;border-top:1px solid var(--line);max-height:34vh}
  aside#side.idle{max-height:none;padding-block:8px}
  aside#side.idle .more{display:none}
  .hide-s{display:none}
  header{gap:6px;padding:6px 10px}
  .brand small{display:none}
  aside#side.empty{display:none}
  #hint{display:none}
  .stat.hide-s{display:none}
}
@media (prefers-reduced-motion:no-preference){.btn,.tool{transition:background .12s,border-color .12s}}
</style>
