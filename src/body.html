<div id="app">
  <header>
    <div class="brand">Κάτοψη <small>Pythagoras · δοκιμή</small></div>
    <input id="planName" aria-label="Όνομα κάτοψης" value="Παράδειγμα κατοικίας">
    <div class="seg mode" role="group" aria-label="Προβολή"><button id="mRoom">Χώρος</button><button id="mHouse" class="on">Οικία</button></div>
    <select id="flSel" class="flsel" aria-label="Όροφος" title="Όροφος"><option>Ισόγειο</option></select>
    <span class="stat"><span id="stLbl">Ε</span> <b id="stArea">0.00</b> m²</span>
    <span class="stat hide-s"><span id="stPerL">Π</span> <b id="stPer">0.00</b> <span id="stPerU">m</span></span>
    <span class="spacer"></span>
    <button class="btn" id="bUndo" title="Αναίρεση">↶<span class="hide-s"> Αναίρεση</span></button>
    <button class="btn" id="bRedo" title="Επανάληψη">↷</button>
    <button class="btn on" id="bDims">Διαστάσεις</button>
    <button class="btn" id="bThick" title="Γράψε το πάχος πάνω σε κάθε τοίχο">Πάχη</button>
    <button class="btn primary" id="bDxf">DXF<span class="hide-s"> εξαγωγή</span></button>
  </header>

  <nav id="rail" aria-label="Εργαλεία">
    <button class="tool" data-tool="rect"><svg viewBox="0 0 32 32"><rect x="5" y="8" width="22" height="16"/></svg>Ορθογώνιο</button>
    <button class="tool" data-tool="tri"><svg viewBox="0 0 32 32"><path d="M5 25H27L5 7Z"/></svg>Τρίγωνο</button>
    <button class="tool" data-tool="poly"><svg viewBox="0 0 32 32"><path d="M5 5H18V14H27V27H5Z"/></svg>Από πλευρές</button>
    <button class="tool" data-tool="pen"><svg viewBox="0 0 32 32"><path d="M7 25L9 18L21 6L26 11L14 23Z"/><path d="M18 9L23 14"/><path d="M4 28C9 27 12 29 16 28"/></svg>Γραφίδα</button>
    <div class="rail-sep"></div>
    <button class="tool" data-tool="door"><svg viewBox="0 0 32 32"><path d="M4 26H9M23 26H28M9 26V10M9 10A16 16 0 0 1 25 26"/></svg>Πόρτα</button>
    <button class="tool" data-tool="window"><svg viewBox="0 0 32 32"><path d="M4 16H7M25 16H28"/><rect x="7" y="13" width="18" height="6"/><path d="M7 16H25"/></svg>Παράθυρο</button>
    <button class="tool" data-tool="col"><svg viewBox="0 0 32 32"><rect x="10" y="10" width="12" height="12" fill="currentColor"/></svg>Υποστύλωμα</button>
    <button class="tool" data-tool="stair"><svg viewBox="0 0 32 32"><rect x="9" y="4" width="14" height="24"/><path d="M9 9H23M9 14H23M9 19H23M9 24H23"/><path d="M16 26V7M13 10L16 7L19 10"/></svg>Σκάλα</button>
    <button class="tool" data-tool="chim"><svg viewBox="0 0 32 32"><rect x="7" y="9" width="18" height="14" fill="currentColor" fill-opacity=".35"/><rect x="12" y="13" width="8" height="6"/></svg>Καμινάδα</button>
    <button class="tool" data-tool="furn"><svg viewBox="0 0 32 32"><rect x="6" y="5" width="20" height="23" rx="2"/><rect x="9" y="8" width="6" height="4"/><rect x="17" y="8" width="6" height="4"/><path d="M6 15H26"/></svg>Έπιπλο</button>
    <button class="tool" data-tool="label"><svg viewBox="0 0 32 32"><path d="M8 8H24M16 8V25"/></svg>Ετικέτα</button>
  </nav>

  <main id="board">
    <canvas id="cv"></canvas>
    <div class="float" id="hint">Σύρε με το δάχτυλο για να μετακινήσεις. Δύο δάχτυλα για ζουμ.</div>
    <div class="float" id="zoomBox">
      <button class="btn" id="bZoomOut" aria-label="Σμίκρυνση">−</button>
      <button class="btn" id="bFit">Όλη</button>
      <button class="btn" id="bZoomIn" aria-label="Μεγέθυνση">+</button>
    </div>
  </main>

  <aside id="side"></aside>
</div>
<div id="toast" hidden></div>
<div id="dxfBox" hidden>
  <div class="card">
    <h2 style="margin:0">Το DXF είναι έτοιμο</h2>
    <p style="margin:0;color:var(--ink-2)" id="dxfMsg">Η λήψη αρχείου δεν επιτρέπεται εδώ. Πάτα «Αντιγραφή», άνοιξε το Σημειωματάριο, κάνε επικόλληση και αποθήκευσε ως <span class="kbd">katopsi.dxf</span>.</p>
    <textarea id="dxfText" readonly></textarea>
    <div class="actions"><button class="btn primary" id="bCopy">Αντιγραφή</button><button class="btn" id="bCloseDxf">Κλείσιμο</button></div>
  </div>
</div>
