<title>Κάτοψη δοκιμή</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: drafting board. Tool rail left, drawing in the middle, properties sheet right (bottom on phones). */
:root{
  --paper:#f3f5f4; --sheet:#ffffff; --ink:#1d2326; --ink-2:#55605f; --line:#d5dbd9;
  --accent:#1f5f8b; --accent-soft:#e2edf5; --sub:#b4432f; --ok:#2f7a4f; --warn:#a46a10;
  --fill:#e9eef0; --grid:#e3e8e7; --grid-major:#cfd7d5; --furn:#6b7674; --col:#2b3134; --wall:#9ea8a6; --topo:#b06a1f; --ins:#e8c04a; --clad:#b98a5a; --fill-v:#dde3e5; --fill-e:#e1efe5;
  --font:"Commissioner",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#161a1c; --sheet:#1e2326; --ink:#e4e9e8; --ink-2:#9aa6a4; --line:#333b3e;
  --accent:#6fb0dd; --accent-soft:#1f3442; --sub:#e3826d; --ok:#6cc392; --warn:#e2ae55;
  --fill:#232a2d; --grid:#20272a; --grid-major:#2c3539; --furn:#93a09e; --col:#cfd6d5; --wall:#56615f; --topo:#e0a058; --ins:#b8932a; --clad:#9a7149; --fill-v:#2c3538; --fill-e:#1f3027; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#161a1c; --sheet:#1e2326; --ink:#e4e9e8; --ink-2:#9aa6a4; --line:#333b3e;
  --accent:#6fb0dd; --accent-soft:#1f3442; --sub:#e3826d; --ok:#6cc392; --warn:#e2ae55;
  --fill:#232a2d; --grid:#20272a; --grid-major:#2c3539; --furn:#93a09e; --col:#cfd6d5; --wall:#56615f; --topo:#e0a058; --ins:#b8932a; --clad:#9a7149; --fill-v:#2c3538; --fill-e:#1f3027; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;overflow:hidden}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
#app{height:100%;display:grid;grid-template-rows:auto 1fr;grid-template-columns:88px 1fr 320px;
  grid-template-areas:"top top top" "rail board side";
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
header{grid-area:top;display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--sheet);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.02em;display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.brand small{font-weight:500;color:var(--ink-2);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
#planName{flex:1 1 90px;min-width:0;max-width:240px;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:7px 10px}
.stat{font-family:var(--mono);font-size:13px;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.stat b{color:var(--ink);font-weight:600}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:8px 12px;min-height:40px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,.tool:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--sheet);font-weight:600}
.btn.danger{color:var(--sub);border-color:color-mix(in srgb,var(--sub) 45%,var(--line))}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
nav#rail{grid-area:rail;background:var(--sheet);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:8px 6px;overflow-y:auto}
.tool{border:1px solid transparent;background:none;border-radius:10px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font-size:12px;line-height:1.15;text-align:center;color:var(--ink)}
.tool svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:1.6}
.tool:hover{background:var(--paper)}
.tool.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.rail-sep{height:1px;background:var(--line);margin:4px 6px}
main#board{grid-area:board;position:relative;min-width:0;min-height:0;overflow:hidden;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
.float{position:absolute;display:flex;gap:6px}
#zoomBox{right:12px;bottom:12px}
#zoomBox .btn{min-width:44px;background:color-mix(in srgb,var(--sheet) 92%,transparent)}
#hint{left:12px;bottom:12px;font-size:12px;color:var(--ink-2);background:color-mix(in srgb,var(--sheet) 88%,transparent);padding:6px 10px;border-radius:6px;max-width:60%}
aside#side{grid-area:side;background:var(--sheet);border-left:1px solid var(--line);overflow-y:auto;padding:14px 16px 24px;min-width:0}
aside h2{font-size:17px;margin:0 0 4px;text-wrap:balance}
aside p{margin:6px 0;color:var(--ink-2);line-height:1.45;font-size:14px}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
details.grp{border-top:1px solid var(--line);margin:0}
details.grp:last-of-type{border-bottom:1px solid var(--line)}
details.grp>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:12px 2px;font-weight:600;font-size:15px;color:var(--ink);min-height:44px;box-sizing:border-box}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::before{content:'▸';color:var(--ink-2);font-size:12px;width:12px;transition:transform .15s}
details.grp[open]>summary::before{transform:rotate(90deg)}
details.grp>summary span{margin-left:auto;font-weight:400;font-size:12px;color:var(--ink-2);font-family:var(--mono);text-align:right}
details.grp>.grpb{padding:0 0 14px}
.form{display:grid;gap:10px;margin-top:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
label.f{display:grid;gap:4px;font-size:12px;color:var(--ink-2);min-width:0}
label.f input,label.f select{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:9px 10px;font-family:var(--mono);font-size:16px;width:100%;min-width:0;font-variant-numeric:tabular-nums}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.note{font-size:13px;color:var(--ink-2);background:var(--paper);border-radius:8px;padding:8px 10px;line-height:1.4}
.note.warn{color:var(--warn)}
.note.ok{color:var(--ok)}
.lib{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.lib button{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 9px;cursor:pointer;min-height:44px}
.lib button span{display:block;font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.lib button:hover{border-color:var(--accent)}
.sides{display:grid;gap:6px}
.side-row{display:grid;grid-template-columns:28px 1fr 1fr 30px;gap:6px;align-items:end}
.side-row .n{font-family:var(--mono);font-size:13px;color:var(--ink-2);padding-bottom:10px}
.lay-row{display:grid;grid-template-columns:minmax(0,1fr) 62px auto 28px 28px;gap:6px;align-items:center}
.lay-row select,.lay-row input{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:8px;font-size:15px;min-width:0;width:100%}
.lay-row input{font-family:var(--mono);text-align:right}
.lay-row span{font-size:12px;color:var(--ink-2)}
.lay-row button{border:none;background:none;font-size:18px;cursor:pointer;color:var(--ink-2);padding:0}
.lay-row button[data-ld]{color:var(--sub);font-size:20px}
.lay-row button:disabled{opacity:.3}
.chk-row{display:grid;grid-template-columns:1fr 1fr 1.3fr 28px;gap:6px;align-items:end;margin-top:6px}
.chk-row select{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:9px 6px;font-size:16px;min-width:0}
.chk-row button{border:none;background:none;color:var(--sub);font-size:20px;cursor:pointer;padding-bottom:6px}
.chk{display:inline-block;min-width:18px;text-align:center;font-weight:700}
.side-row button{border:none;background:none;color:var(--sub);font-size:20px;cursor:pointer;padding-bottom:6px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:none;background:var(--paper);padding:8px 6px;cursor:pointer;min-height:40px}
.seg button.on{background:var(--accent);color:var(--sheet)}
dl.sum{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:10px 0;font-size:14px}
dl.sum dt{color:var(--ink-2)} dl.sum dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums}
.seg.mode{flex:0 0 auto}
.seg.mode button{padding:8px 14px;font-weight:600}
.tbl{overflow-x:auto;margin:10px 0}
.tbl table{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:600;padding:4px 0;border-bottom:1px solid var(--line)}
.tbl td{padding:6px 0;border-bottom:1px solid var(--line)}
.tbl td:not(:first-child),.tbl th:not(:first-child){text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{color:var(--accent)}
.tbl tr.sub td{text-align:left!important;font-family:var(--font)!important;font-size:12px;color:var(--ink-2);padding-top:0}
.tbl tr.sub + tr td, .tbl tbody tr:has(+ tr.sub) td{border-bottom:none}
.tbl tfoot td{font-weight:600;border-bottom:none}
.tbl tr.nohov{cursor:default}
.tbl tbody tr.nohov:hover td{color:inherit}
.tbl input,.tbl select{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:6px;font-size:15px;font-family:var(--mono);max-width:100%}
.tbl tr.cur td{color:var(--accent);font-weight:600}
.flsel{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 6px;min-height:40px;font-weight:600;max-width:140px}
.segs{display:grid;gap:0;margin:4px 0}
.sgr{display:grid;grid-template-columns:1fr auto auto;gap:4px 8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.sgr b{font-weight:600;font-size:14px}
.sgr span{white-space:nowrap;font-size:14px;color:var(--ink-2)}
.sgr input{width:64px;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:7px;font-size:16px;font-family:var(--mono)}
.sgr select{grid-column:1/-1;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:8px;font-size:15px;min-width:0}
.sgr .btn{min-height:36px;padding:4px 12px}
@media (min-width:821px) and (max-width:1440px){#bUndo .hide-s{display:none}}
.tbl tfoot tr:last-child td{border-top:2px solid var(--ink)}
.layers{display:grid;gap:4px;max-height:180px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin:6px 0;font-size:13px}
.layers label{display:flex;gap:6px;align-items:center;min-width:0}
.layers span{margin-left:auto;color:var(--ink-2);font-family:var(--mono);font-size:11px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:90vw}
#dxfBox{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 45%,transparent);display:grid;place-items:center;z-index:15;padding:16px}
#dxfBox .card{background:var(--sheet);border-radius:12px;padding:16px;width:min(640px,100%);display:grid;gap:10px}
#dxfText{width:100%;height:220px;font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:6px;background:var(--paper);padding:8px}
.kbd{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 4px}
@media (max-width:820px){
  #app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto auto;grid-template-areas:"top" "board" "side" "rail"}
  nav#rail{flex-direction:row;overflow-x:auto;border-right:none;border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px))}
  .tool{min-width:72px}
  .rail-sep{width:1px;height:auto;margin:6px 2px}
  aside#side{border-left:none;border-top:1px solid var(--line);max-height:34vh}
  aside#side.idle{max-height:none;padding-block:8px}
  aside#side.idle .more{display:none}
  .hide-s{display:none}
  header{gap:6px;padding:6px 10px}
  .brand small{display:none}
  aside#side.empty{display:none}
  #hint{display:none}
  .stat.hide-s{display:none}
}
@media (prefers-reduced-motion:no-preference){.btn,.tool{transition:background .12s,border-color .12s}}
</style>
<div id="app">
  <header>
    <div class="brand">Κάτοψη <small>ΑΝΤΙΓΡΑΦΟ ΔΟΚΙΜΗΣ</small></div>
    <input id="planName" aria-label="Όνομα κάτοψης" value="Παράδειγμα κατοικίας">
    <div class="seg mode" role="group" aria-label="Προβολή"><button id="mRoom">Χώρος</button><button id="mHouse" class="on">Οικία</button></div>
    <select id="flSel" class="flsel" aria-label="Όροφος" title="Όροφος"><option>Ισόγειο</option></select>
    <span class="stat"><span id="stLbl">Ε</span> <b id="stArea">0.00</b> m²</span>
    <span class="stat hide-s"><span id="stPerL">Π</span> <b id="stPer">0.00</b> <span id="stPerU">m</span></span>
    <span class="spacer"></span>
    <button class="btn" id="bUndo" title="Αναίρεση">↶<span class="hide-s"> Αναίρεση</span></button>
    <button class="btn" id="bRedo" title="Επανάληψη">↷</button>
    <button class="btn on" id="bDims">Διαστάσεις</button>
    <button class="btn" id="bThick" title="Γράψε το πάχος πάνω σε κάθε τοίχο">Πάχη</button>
    <button class="btn primary" id="bDxf">DXF<span class="hide-s"> εξαγωγή</span></button>
  </header>

  <nav id="rail" aria-label="Εργαλεία">
    <button class="tool" data-tool="rect"><svg viewBox="0 0 32 32"><rect x="5" y="8" width="22" height="16"/></svg>Ορθογώνιο</button>
    <button class="tool" data-tool="tri"><svg viewBox="0 0 32 32"><path d="M5 25H27L5 7Z"/></svg>Τρίγωνο</button>
    <button class="tool" data-tool="poly"><svg viewBox="0 0 32 32"><path d="M5 5H18V14H27V27H5Z"/></svg>Από πλευρές</button>
    <button class="tool" data-tool="pen"><svg viewBox="0 0 32 32"><path d="M7 25L9 18L21 6L26 11L14 23Z"/><path d="M18 9L23 14"/><path d="M4 28C9 27 12 29 16 28"/></svg>Γραφίδα</button>
    <div class="rail-sep"></div>
    <button class="tool" data-tool="door"><svg viewBox="0 0 32 32"><path d="M4 26H9M23 26H28M9 26V10M9 10A16 16 0 0 1 25 26"/></svg>Πόρτα</button>
    <button class="tool" data-tool="window"><svg viewBox="0 0 32 32"><path d="M4 16H7M25 16H28"/><rect x="7" y="13" width="18" height="6"/><path d="M7 16H25"/></svg>Παράθυρο</button>
    <button class="tool" data-tool="col"><svg viewBox="0 0 32 32"><rect x="10" y="10" width="12" height="12" fill="currentColor"/></svg>Υποστύλωμα</button>
    <button class="tool" data-tool="stair"><svg viewBox="0 0 32 32"><rect x="9" y="4" width="14" height="24"/><path d="M9 9H23M9 14H23M9 19H23M9 24H23"/><path d="M16 26V7M13 10L16 7L19 10"/></svg>Σκάλα</button>
    <button class="tool" data-tool="chim"><svg viewBox="0 0 32 32"><rect x="7" y="9" width="18" height="14" fill="currentColor" fill-opacity=".35"/><rect x="12" y="13" width="8" height="6"/></svg>Καμινάδα</button>
    <button class="tool" data-tool="furn"><svg viewBox="0 0 32 32"><rect x="6" y="5" width="20" height="23" rx="2"/><rect x="9" y="8" width="6" height="4"/><rect x="17" y="8" width="6" height="4"/><path d="M6 15H26"/></svg>Έπιπλο</button>
    <button class="tool" data-tool="label"><svg viewBox="0 0 32 32"><path d="M8 8H24M16 8V25"/></svg>Ετικέτα</button>
  </nav>

  <main id="board">
    <canvas id="cv"></canvas>
    <div class="float" id="hint">Σύρε με το δάχτυλο για να μετακινήσεις. Δύο δάχτυλα για ζουμ.</div>
    <div class="float" id="zoomBox">
      <button class="btn" id="bZoomOut" aria-label="Σμίκρυνση">−</button>
      <button class="btn" id="bFit">Όλη</button>
      <button class="btn" id="bZoomIn" aria-label="Μεγέθυνση">+</button>
    </div>
  </main>

  <aside id="side"></aside>
</div>
<div id="toast" hidden></div>
<div id="dxfBox" hidden>
  <div class="card">
    <h2 style="margin:0">Το DXF είναι έτοιμο</h2>
    <p style="margin:0;color:var(--ink-2)" id="dxfMsg">Η λήψη αρχείου δεν επιτρέπεται εδώ. Πάτα «Αντιγραφή», άνοιξε το Σημειωματάριο, κάνε επικόλληση και αποθήκευσε ως <span class="kbd">katopsi.dxf</span>.</p>
    <textarea id="dxfText" readonly></textarea>
    <div class="actions"><button class="btn primary" id="bCopy">Αντιγραφή</button><button class="btn" id="bCloseDxf">Κλείσιμο</button></div>
  </div>
</div>

  if(o.ext==null) o.ext=0.5; if(o.int==null) o.int=0.2; if(o.topo===undefined) o.topo=null;
  if(!Array.isArray(o.cons)||!o.cons.length) o.cons=consLib(); if(o.extC===undefined) o.extC=null; if(!(o.tol>0)) o.tol=0.03;

function consOpts(sel,kind){ const L=(S.cons||[]).slice().sort((a,b)=>(a.kind===kind?0:1)-(b.kind===kind?0:1));
  return L.map(c=>`<option value="${c.id}" ${sel===c.id?'selected':''}>${esc(c.name)} · ${cm(consT(c))} εκ.${c.kind!==kind?' ('+(c.kind==='int'?'εσωτ.':'εξωτ.')+')':''}</option>`).join(''); }
function upsertOverride(room,a,b,val){ room.walls=room.walls||[]; const ov=findOverride(room,a,b); const o={k:wallKey(room.id,a,b)}; Object.assign(o,val); if(ov) room.walls[room.walls.indexOf(ov)]=o; else room.walls.push(o); }
function stripExtOverrides(roomId){ const room=roomById(roomId); if(!room||!room.walls) return; room.walls=room.walls.filter(o=>!WALLS.some(W=>W.room===roomId&&W.ext&&keyMatch(roomId,o.k,W.a,W.b)<0.08)); }
function moveRoom(id,dx,dy){ for(const it of roomItems(id)){ it.x=r4(it.x+dx); it.y=r4(it.y+dy); } }
// who: 'nb' μετακινείται ο διπλανός, 'self' μετακινείται ο ίδιος ο χώρος
function setWallT(w,v,who,noSnap){ if(!(v>0&&v<3)) return toast('Γράψε πάχος σε μέτρα, π.χ. 0.20');
  const room=roomById(w.room);
  if(w.ext){ // ο τοίχος μένει επιλεγμένος: βρίσκεται από ένα σημείο κοντά στην εξωτερική παρειά, που δεν κινείται
    const m=[(w.a[0]+w.b[0])/2+w.on[0]*(w.T-0.02),(w.a[1]+w.b[1])/2+w.on[1]*(w.T-0.02)];
    const reSel=()=>{ const W2=hitWall(m); if(W2&&W2.ext){ selWall={room:W2.room,k:wallKey(W2.room,W2.a,W2.b)}; render(); renderSide(); } };
    if(typeof ktWallsIn==='function'&&ktWallsIn(()=>upsertOverride(room,w.a,w.b,{t:r4(v)}))){ reSel(); return; } if(!noSnap) snap(); upsertOverride(room,w.a,w.b,{t:r4(v)}); commit(); return toast('Ο τοίχος έγινε '+cm(v)+' εκ. Ο χώρος έμεινε ίδιος.'); }
  if(!noSnap) snap();
  const delta=v-w.gap; if(who==='self') moveRoom(w.room,-w.on[0]*delta,-w.on[1]*delta); else if(w.nb!=null) moveRoom(w.nb,w.on[0]*delta,w.on[1]*delta);
  commit(); const mv=roomById(who==='self'?w.room:w.nb); toast('Ο τοίχος έγινε '+cm(v)+' εκ. Μετακινήθηκε '+(delta>0?'':'πίσω ')+'ο «'+(mv?mv.name:'')+'» κατά '+cm(Math.abs(delta))+' εκ.'); }
// αλλαγή που μπορεί να αλλάξει πάχος εξωτερικών τοίχων: στο αντίγραφο δοκιμής το πάχος αλλάζει από την εσωτερική παρειά

// ---------- DXF reading (topographer outline, Pythagoras room) ----------
function parseDXF(txt){
  const L=txt.split(/\r?\n/); const pairs=[]; for(let i=0;i+1<L.length;i+=2) pairs.push([parseInt(L[i],10),L[i+1].trim()]);
  let i=0; while(i<pairs.length&&!(pairs[i][0]===2&&pairs[i][1]==='ENTITIES')) i++;
  const ents=[]; let cur=null, poly=null;
  const flush=()=>{ if(!cur) return; const c=cur; cur=null;
    if(c.type==='LINE'&&c.x!=null&&c.x1!=null) ents.push({l:c.layer,pts:[[c.x,c.y],[c.x1,c.y1]],c:0});
    else if(c.type==='LWPOLYLINE'&&c.v.length>1) ents.push({l:c.layer,pts:c.v,c:(c.flag&1)?1:0});
    else if(c.type==='CIRCLE'&&c.r){ const p=[]; for(let k=0;k<32;k++){const a=k/32*Math.PI*2;p.push([c.x+c.r*Math.cos(a),c.y+c.r*Math.sin(a)]);} ents.push({l:c.layer,pts:p,c:1}); }
    else if(c.type==='ARC'&&c.r){ let a0=c.a0, a1=c.a1; if(a1<a0) a1+=360; const n=Math.max(4,Math.round((a1-a0)/10)); const p=[]; for(let k=0;k<=n;k++){const a=rad(a0+(a1-a0)*k/n);p.push([c.x+c.r*Math.cos(a),c.y+c.r*Math.sin(a)]);} ents.push({l:c.layer,pts:p,c:0}); }
    else if(c.type==='POLYLINE'){ poly={layer:c.layer,flag:c.flag||0,v:[]}; }
    else if(c.type==='VERTEX'&&poly){ if(c.x!=null) poly.v.push([c.x,c.y]); }
    else if(c.type==='SEQEND'&&poly){ if(poly.v.length>1) ents.push({l:poly.layer,pts:poly.v,c:(poly.flag&1)?1:0}); poly=null; } };
  for(i++;i<pairs.length;i++){ const [g,v]=pairs[i];
    if(g===0){ flush(); if(v==='ENDSEC') break; cur={type:v,layer:'0',v:[],flag:0}; continue; }
    if(!cur) continue;
    if(g===8) cur.layer=v; else if(g===10){ cur.x=parseFloat(v); if(cur.type==='LWPOLYLINE') cur.v.push([cur.x,null]); } else if(g===20){ cur.y=parseFloat(v); if(cur.type==='LWPOLYLINE'&&cur.v.length) cur.v[cur.v.length-1][1]=cur.y; }
    else if(g===11) cur.x1=parseFloat(v); else if(g===21) cur.y1=parseFloat(v); else if(g===40) cur.r=parseFloat(v); else if(g===50) cur.a0=parseFloat(v); else if(g===51) cur.a1=parseFloat(v); else if(g===70) cur.flag=parseInt(v,10); }
  flush();
  return ents.filter(e=>e.pts.every(p=>isFinite(p[0])&&isFinite(p[1])));
}
function dxfDecode(s){ return s.replace(/\\U\+([0-9A-Fa-f]{4})/g,(m,h)=>String.fromCharCode(parseInt(h,16))); }
let pickMode=null;
const fileIn=document.createElement('input'); fileIn.type='file'; fileIn.accept='.dxf,.DXF'; fileIn.hidden=true; document.body.appendChild(fileIn);
function pickFile(m){ pickMode=m; fileIn.value=''; fileIn.click(); }
fileIn.onchange=()=>{ const f=fileIn.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ try{ (pickMode==='topo'?loadTopo:loadRoomDXF)(String(rd.result),f.name); }catch(e){ console.error(e); toast('Δεν μπόρεσα να διαβάσω αυτό το DXF. Χρειάζεται DXF σε μορφή κειμένου (ASCII).'); } }; rd.readAsText(f); };
function loadTopo(txt,file){
  const ents=parseDXF(txt); if(!ents.length) return toast('Δεν βρήκα γραμμές στο DXF');
  let x0=1e18,y1=-1e18; for(const e of ents) for(const p of e.pts){ x0=Math.min(x0,p[0]); y1=Math.max(y1,p[1]); }
  const count={}, layers={}; for(const e of ents){ count[e.l]=(count[e.l]||0)+1; layers[e.l]=true; }

// measured outline (DXF coords, y up) -> poly in this plan, near the draft and turned like it
function pyShapeFrom(outline, roomId){
  let pts=outline.map(p=>[p[0],-p[1]]); const c0=centroid(pts); pts=pts.map(p=>[r4(p[0]-c0[0]),r4(p[1]-c0[1])]); pts=cleanRing(pts); if(areaRing(pts)<0) pts.reverse();
  const old=roomItems(roomId).filter(isShape); let cx, cy, rot=0;
  if(old.length&&OL[roomId]&&OL[roomId].polys.length){ const b=bbox(roomId); cx=(b[0]+b[2])/2; cy=(b[1]+b[3])/2; const dw=b[2]-b[0], dh=b[3]-b[1]; let best=1e9;
    for(const a of [0,90,180,270]){ const q=pts.map(p=>rotP(p[0],p[1],a)); const xs=q.map(p=>p[0]), ys=q.map(p=>p[1]); const w=Math.max(...xs)-Math.min(...xs), hh=Math.max(...ys)-Math.min(...ys); const err=Math.abs(w-dw)+Math.abs(hh-dh)+a*1e-4; if(err<best){best=err;rot=a;} } }
  else { const hb=S.items.length?bbox():[0,0,0,0]; cx=S.items.length?hb[2]+S.ext*2+3:0; cy=S.items.length?(hb[1]+hb[3])/2:0; }
  return {pts,cx,cy,rot}; }
function pyApply(roomId, r){

  S.items.push({id:S.next++,room:roomId,t:'poly',x:r4(f.cx),y:r4(f.cy),rot:f.rot,sub:false,pts:f.pts,src:{k:'laser',sig:pySig(r),file:r.name}});
  const room=roomById(roomId); room.laser=pySig(r); compute(); }
function pySig(r){ return JSON.stringify(r.outline).length+':'+fmt(r.area||0); }
function pySync(){ const c=pyCase(); if(!c) return; const done=[];
  for(const room of S.rooms){ const r=c.rooms.find(x=>x.kat===room.id); if(!r||!r.outline||r.outline.length<3) continue; 
    if(room.laser===pySig(r)) continue;
    if(!done.length) snap(); pyApply(room.id,r); done.push(room.name);
    const sd=roomSnapDelta(edgesCopy(room.id),0,0,room.id,0.35); snapMark=null; if(sd) for(const it of roomItems(room.id)){ it.x=r4(it.x+sd[0]); it.y=r4(it.y+sd[1]); } }

// ---------- Οδηγός: η αποτύπωση σε απλές καρτέλες, μία δουλειά ανά καρτέλα ----------

const WZKEY = STORE + '.wz';

let wzLayout = null;

const wzPhase = {A:'Έργο', B:'Χώρος', C:'Οικία', D:'Παράδοση'};

      <button class="wz-opt" id="wzPoly"><b>Από πλευρές ή τρίγωνο</b><span>Στην ελεύθερη σχεδίαση, με γωνίες ή διαγώνιους.</span></button></div>

    body:()=>`<p class="wz-lead">Ζωγράφισε το περίγραμμα με μία γραμμή. Οι πλευρές ισιώνουν και οι γωνίες κουμπώνουν σε 90° ή 45°.</p>

    bind:()=>{ $('wzO90').onchange=()=>{ penOpt.only90=$('wzO90').checked; }; },
    next:()=> wzPen(cur)? {to:'sides'} : null },
  sides:{ phase:'B', n:'9α', room:true, mode:'room',
    enter:()=>{ const it=wzPen(cur); if(it){ penEdit={id:it.id,active:WZ.side||0,dirty:false}; sel=it.id; } requestAnimationFrame(()=>fit(cur)); },
    title:()=>'Μέτρηση πλευρών',
    body:()=>{ const it=wzPen(cur); if(!it) return '<p>Ο χώρος δεν έχει σκίτσο.</p>';
      const n=it.src.sides.length, i=Math.min(WZ.side||0,n-1), g=penSolve(it.src.sides), s=it.src.sides[i];
      return `<div class="wz-side"><span class="wz-q">Μέτρησε την πλευρά</span><span class="wz-letter">${corner(i)}${corner((i+1)%n)}</span><span class="wz-of">${i+1} από ${n}</span></div>
      <label class="f wz-in">Μήκος (m)<input id="wzM" inputmode="decimal" autocomplete="off" value="${s.m!=null?fmt(s.m):''}" placeholder="${fmt(g.L[i])}"></label>

      <div class="actions"><button class="btn" id="wzSkip">Δεν μετριέται, επόμενη</button></div>`; },
    bind:()=>{ const it=wzPen(cur); if(!it) return; const n=it.src.sides.length; const el=$('wzM'); penEdit=penEdit&&penEdit.id===it.id?penEdit:{id:it.id,active:0,dirty:false}; penEdit.active=Math.min(WZ.side||0,n-1); render();
      const idx=WZ.side||0; let done=false;
      const adv=()=>{ if((WZ.side||0)<n-1){ WZ.side=(WZ.side||0)+1; wzSave(); penEdit.active=WZ.side; render(); renderSide(); } else wzGo('check'); };
      el.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); const v=String(el.value).trim(); if(v===''){ done=true; adv(); return; } const x=num(v); if(!(x>0)) return toast('Γράψε μήκος σε μέτρα');
        done=true; wzSideSet(it,idx,x); fit(cur); adv(); } });
      el.addEventListener('change',()=>{ if(done||!el.isConnected) return; const v=String(el.value).trim(); const x=v===''?null:num(v); if(v!==''&&!(x>0)) return; wzSideSet(it,idx,x); render(); const pi=$('wzPI'); if(pi) pi.innerHTML=penInfo(it); });
      side.querySelectorAll('[data-ws]').forEach(b=>b.onclick=()=>{ WZ.side=+b.dataset.ws; wzSave(); penEdit.active=WZ.side; render(); renderSide(); });
      $('wzSkip').onclick=()=>{ if(it.src.sides[WZ.side||0].m!=null) wzSideSet(it,WZ.side||0,null); adv(); };
      setTimeout(()=>{ el.focus(); el.select(); },30); },
    next:()=>({to:'check', label:'Τέλος μετρήσεων →'}) },
  wsides:{ phase:'B', n:'9α', room:true, mode:'room',
    enter:()=>{ penEdit=null; sel=null; requestAnimationFrame(()=>fit(cur)); },
    title:()=>'Μέτρηση πλευρών',
    body:()=>{ if(!wmRoomOk(cur)) return '<p>Ο χώρος δεν βγαίνει από τοίχους.</p>'; const Sd=wmSides(cur), n=Sd.length; if(!n) return '<p>Ο χώρος δεν έχει σχήμα.</p>';

      <label class="f wz-in">Μήκος (m)<input id="wzM" inputmode="decimal" autocomplete="off" value="${M[i]!=null?fmt(M[i]):''}" placeholder="${fmt(Sd[i].L)}"></label>

      <div class="note">Η μέτρηση μετακινεί τον εσωτερικό τοίχο στην άκρη της πλευράς. Ο εξωτερικός τοίχος και οι έτοιμοι χώροι δεν αλλάζουν. Αν δεν γίνεται, η διαφορά φαίνεται στον έλεγχο.</div>
      <div class="actions"><button class="btn" id="wzSkip">Δεν μετριέται, επόμενη</button></div>`; },
    bind:()=>{ if(!wmRoomOk(cur)) return; const n=wmSides(cur).length, el=$('wzM'); if(!el) return; const idx=Math.min(WZ.side||0,n-1); let done=false;
      const adv=()=>{ if(idx<n-1){ WZ.side=idx+1; wzSave(); renderSide(); } else wzGo('check'); };
      const put=x=>{ const r=wmMeasure(cur,idx,x); toast(wmMeasMsg(r,'Πλευρά '+corner(idx)+corner((idx+1)%n))); render(); };
      el.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); const v=String(el.value).trim(); if(v===''){ done=true; adv(); return; } const x=num(v); if(!(x>0)) return toast('Γράψε μήκος σε μέτρα'); done=true; put(x); adv(); } });
      el.addEventListener('change',()=>{ if(done||!el.isConnected) return; const v=String(el.value).trim(); const x=num(v); if(v===''||!(x>0)) return; done=true; put(x); renderSide(); });
      side.querySelectorAll('[data-ws]').forEach(b=>b.onclick=()=>{ WZ.side=+b.dataset.ws; wzSave(); renderSide(); });
      $('wzSkip').onclick=adv; setTimeout(()=>{ el.focus(); el.select(); },30); },
    next:()=>({to:'check', label:'Τέλος μετρήσεων →'}) },
  check:{ phase:'B', n:'10', room:true, mode:'room',

    next:()=>({to:'open'}) },
  open:{ phase:'B', n:'11', room:true, mode:'room',
    enter:()=>{ requestAnimationFrame(()=>fit(cur)); },
    title:()=>'Πόρτες και παράθυρα',
    body:()=>{ const ops=roomItems(cur).filter(i=>i.t==='door'||i.t==='window');

    next:()=>({to:'rdone', label: roomItems(cur).some(i=>i.t==='door'||i.t==='window')?'Επόμενο →':'Κανένα άνοιγμα →'}) },

    title:()=>'Τέλος χώρου',

// ---------- Κτίριο: δέντρο (Κτίριο > Όροφοι > Ομάδες > Χώροι), περιγράμματα ορόφου / κτιρίου, αποστάσεις αντικειμένων ----------
// Μπαίνει μέσα στο app.js (build.py) πριν από το «start», ΜΟΝΟ στο αντίγραφο δοκιμής. Άγκιστρα στο app.js με typeof.
// Δεδομένα: FL().ol = περίγραμμα ορόφου [[x,y]…] (αν λείπει, το μικτό βγαίνει από τους χώρους) · S.bld={ring} = περίγραμμα κτιρίου
// (αν λείπει, του τοπογράφου) · room.grp = ομάδα χώρων μέσα στον όροφο (π.χ. «Διαμέρισμα Α1»).
let KO = null;   // επεξεργασία περιγράμματος: {k:'floor'|'bld', act}
let KD = null;   // σύρσιμο γωνίας: {i, pre, moved, sx, sy}
const KTKEY = STORE + '.tree';
const KT = (()=>{ try{ const o=JSON.parse(localStorage.getItem(KTKEY)); if(o) return {open:o.open!==false, min:!!o.min, pos:o.pos||null, shut:new Set(o.shut||[])}; }catch(e){} return {open:innerWidth>700, min:false, pos:null, shut:new Set()}; })();
function ktSave(){ try{ localStorage.setItem(KTKEY, JSON.stringify({open:KT.open, min:KT.min, pos:KT.pos, shut:[...KT.shut]})); }catch(e){} }

// ---- περιγράμματα ----
const KNAME = {floor:'Περίγραμμα ορόφου', bld:'Περίγραμμα κτιρίου'};
function ktRing(k){ return k==='floor'? (FL().ol||null) : (S.bld&&S.bld.ring||null); }
function ktSetRing(k,r){ if(k==='floor'){ if(r) FL().ol=r; else delete FL().ol; } else { if(r) S.bld={ring:r}; else delete S.bld; } }
function ktRings(){ return [FL().ol, S.bld&&S.bld.ring].filter(r=>r&&r.length>=3); }
function ktStat(r){ let per=0; for(let i=0;i<r.length;i++){ const a=r[i], b=r[(i+1)%r.length]; per+=Math.hypot(b[0]-a[0],b[1]-a[1]); } return {area:Math.abs(areaRing(r)), per}; }
function ktBig(P){ let best=null, ba=0; for(const poly of P){ const a=Math.abs(areaRing(poly[0])); if(a>ba){ ba=a; best=poly[0]; } } return best; }
const ktR4 = r => r.map(p=>[r4(p[0]),r4(p[1])]);
function ktRect(){ if(S.items.some(isShape)){ const b=bbox(); return [[b[0],b[1]],[b[2],b[1]],[b[2],b[3]],[b[0],b[3]]]; }
  const c=S2W(cv.clientWidth/2,cv.clientHeight/2); return ktR4([[c[0]-5,c[1]-4],[c[0]+5,c[1]-4],[c[0]+5,c[1]+4],[c[0]-5,c[1]+4]]); }
function ktFromRooms(){ compute(); const r=ktBig(HOUSE.foot); return r? ktR4(cleanRing(r)) : null; }
function ktFromTopo(){ const T=S.topo; if(!T||!T.bld||!(T.bldRings||[]).length) return null; let r=T.bldRings[0]; for(const q of T.bldRings) if(Math.abs(areaRing(q))>Math.abs(areaRing(r))) r=q; return ktR4(r); }
function ktDefault(k){ if(k==='floor') return (S.bld&&S.bld.ring?ktR4(S.bld.ring):null)||ktFromTopo()||ktFromRooms()||ktRect(); return ktFromTopo()||(FL().ol?ktR4(FL().ol):null)||ktFromRooms()||ktRect(); }
function ktEdit(k){ if(typeof wzActive==='function'&&wzActive()) wzFree();
  if(mode!=='house'){ mode='house'; markMode(); }
  sel=null; tool=null; markTool(); selRoom=null; selWall=null; consEdit=null; splitting=null;
  if(!ktRing(k)){ snap(); ktSetRing(k,ktDefault(k)); save(); }
  KO={k, act:-1}; compute(); render(); renderSide(); fit(); }
function ktEsc(){ KO=null; KD=null; KC=null; KW=null; if(KT.cut){ KT.cut=null; } }
// αλλαγή μήκους πλευράς i: η τελική γωνία (και η επόμενη, ώστε η επόμενη πλευρά να μένει παράλληλη) πάει κατά μήκος της πλευράς
function ktSetLen(r,i,L){ const n=r.length, a=r[i], b=r[(i+1)%n], L0=Math.hypot(b[0]-a[0],b[1]-a[1]); if(L0<1e-6) return;
  const d=L-L0, ux=(b[0]-a[0])/L0, uy=(b[1]-a[1])/L0;
  for(const j of (n>3?[(i+1)%n,(i+2)%n]:[(i+1)%n])) r[j]=[r4(r[j][0]+ux*d), r4(r[j][1]+uy*d)]; }
function ktAngle(r,i){ const n=r.length, p=r[(i-1+n)%n], c=r[i], q=r[(i+1)%n];
  const a1=Math.atan2(p[1]-c[1],p[0]-c[0]), a2=Math.atan2(q[1]-c[1],q[0]-c[0]); let d=Math.abs(a1-a2)*180/Math.PI; if(d>180) d=360-d;
  // εσωτερική ή εξωτερική γωνία: κοίτα αν η διχοτόμος πέφτει μέσα
  const bx=Math.cos(a1)+Math.cos(a2), by=Math.sin(a1)+Math.sin(a2), L=Math.hypot(bx,by)||1, t=[c[0]+bx/L*0.01,c[1]+by/L*0.01];
  return inRing(t,r)? d : 360-d; }
function ktSnap(p,i){ const r=ktRing(KO.k), n=r.length, tol=12/view.s; let best=null, bd=tol;
  const C=[]; for(const room of S.rooms){ const o=OL[room.id]; if(o) for(const e of o.edges) C.push(e.a); }
  for(const poly of HOUSE.foot) for(const q of poly[0]) C.push(q);
  if(S.topo) for(const e of S.topo.ents) if(S.topo.layers[e.l]!==false) for(const q of e.pts) C.push(q);
  const other=KO.k==='floor'?(S.bld&&S.bld.ring):FL().ol; if(other) C.push(...other);
  for(const q of C){ const d=Math.hypot(q[0]-p[0],q[1]-p[1]); if(d<bd){ bd=d; best=q; } }
  if(best){ snapMark=best; return [r4(best[0]),r4(best[1])]; }
  snapMark=null; let x=Math.round(p[0]*100)/100, y=Math.round(p[1]*100)/100;
  for(const q of [r[(i-1+n)%n], r[(i+1)%n]]){ if(Math.abs(q[0]-p[0])<tol) x=q[0]; if(Math.abs(q[1]-p[1])<tol) y=q[1]; }
  return [r4(x),r4(y)]; }
function ktSnapEdges(){ const E=[]; for(const r of ktRings()) for(let i=0;i<r.length;i++){ const a=r[i], b=r[(i+1)%r.length], L=Math.hypot(b[0]-a[0],b[1]-a[1]); if(L<0.05) continue; E.push({a,b,L,ux:(b[0]-a[0])/L,uy:(b[1]-a[1])/L}); } return E; }

// ---- δείκτης (ποντίκι / δάχτυλο / γραφίδα) ----

// ---------- Ε9: κύριοι (ΚΧ) / βοηθητικοί (ΒΧ) χώροι με τοίχους ----------
// Κάθε κλειστός χώρος παίρνει το μισό πάχος των εσωτερικών τοίχων του και όλο το πάχος των εξωτερικών.
// Ημιυπαίθριοι / εξώστες μένουν με το καθαρό τους. Τρέχων όροφος (S.rooms, OL, WALLS, HOUSE από το compute).
const E9U = {kyr:'ΚΧ', voith:'ΒΧ', imiy:'Ημιυπ.', exo:'Εξώστ.'};
function ktPolyArea(P){ let a=0; for(const poly of P){ a+=Math.abs(areaRing(poly[0])); for(let i=1;i<poly.length;i++) a-=Math.abs(areaRing(poly[i])); } return a; }
function ktE9(){ const out=[], closed=[];
  for(const room of S.rooms){ const o=OL[room.id]; if(!o||!o.polys.length) continue; const u=useOf(room);
    if(isOpen(room)){ out.push({room,u,net:o.area,e9:o.area,polys:o.polys}); continue; }
    // 1) μισό εσωτερικό, όλο το εξωτερικό· όπου ο τοίχος είναι μισός εξωτερικός, πρώτα μόνο το μισό του κενού
    let P=o.polys.map((poly,pi)=>{ const r=poly[0], d=r.map((a,i)=>{ const W=WALLS.find(w=>w.room===room.id&&w.pi===pi&&w.i===i); return !W?0 : W.ext&&!W.part? W.d : W.gap/2; });
      return [varOffset(r,d)].concat(poly.slice(1)); });
    try{ if(HOUSE.foot.length) P=PC.intersection(P,HOUSE.foot); }catch(e){}
    const x={room,u,net:o.area,polys:P}; out.push(x); closed.push(x); }
  // 2) καμία επικάλυψη: ό,τι πήρε ήδη ένας χώρος δεν το ξαναπαίρνει άλλος
  let taken=[]; for(const x of closed){ try{ if(taken.length) x.polys=PC.difference(x.polys,taken); taken=taken.length?PC.union(taken,x.polys):x.polys; }catch(e){} }
  // 3) ό,τι περίσσεψε από το μικτό (εξωτερικός τοίχος σε μισό-εξωτερικές πλευρές, γωνίες) πάει στον χώρο που ακουμπά
  try{ if(HOUSE.foot.length&&closed.length){ const rest=taken.length?PC.difference(HOUSE.foot,taken):HOUSE.foot;
    for(const piece of rest){ if(Math.abs(areaRing(piece[0]))<1e-5) continue; let best=null, bd=1e9;
      for(const x of closed){ let d=0; for(const p of piece[0]){ let m=1e9; for(const poly of x.polys) for(const r of poly) for(let i=0;i<r.length;i++){ const q=segNear(p,r[i],r[(i+1)%r.length]); m=Math.min(m,Math.hypot(q[0]-p[0],q[1]-p[1])); } d+=m; } d/=piece[0].length; if(d<bd){ bd=d; best=x; } }
      if(best) best.polys=PC.union(best.polys,[piece]); } } }catch(e){}
  for(const x of closed) x.e9=ktPolyArea(x.polys);
  const T={kyr:0,voith:0,imiy:0,exo:0}; for(const x of out) T[x.u]+=x.e9;
  return {rooms:out, T, sum:T.kyr+T.voith, foot:HOUSE.footArea}; }
function ktE9Box(){ const E=ktE9(); if(!E.rooms.length) return '';
  const grps=[...new Set(E.rooms.map(x=>x.room.grp||''))], many=grps.length>1||grps[0]!=='';
  const row=x=>`<tr class="nohov"><td>${roomNo(x.room.id)}. ${esc(x.room.name)}</td><td><button class="kbtn kU" data-u="${x.room.id}" title="Άλλαξε κύριος / βοηθητικός" style="font-size:13px;min-height:30px">${E9U[x.u]}</button></td><td style="padding-left:8px">${fmt(x.net)}</td><td style="padding-left:8px"><b>${fmt(x.e9)}</b></td></tr>`;
  const sub=(g,rs)=>{ const t={kyr:0,voith:0}; for(const x of rs) if(t[x.u]!=null) t[x.u]+=x.e9; return `<tr class="nohov"><td colspan="2" style="text-align:left"><b>${esc(g||'Χωρίς ομάδα')}</b></td><td colspan="2" style="color:var(--ink-2)">ΚΧ ${fmt(t.kyr)} · ΒΧ ${fmt(t.voith)}</td></tr>`; };
  const body=grps.map(g=>{ const rs=E.rooms.filter(x=>(x.room.grp||'')===g); return (many?sub(g,rs):'')+rs.map(row).join(''); }).join('');
  const d=E.sum-E.foot, ok=Math.abs(d)<=Math.max(0.05,E.foot*0.002);
  return `<div class="eyebrow" style="margin-top:14px">Ε9 · κύριοι και βοηθητικοί με τοίχους</div>
  <p>Κάθε χώρος παίρνει το μισό πάχος των εσωτερικών τοίχων και όλο το πάχος των εξωτερικών. Πάτα ΚΧ / ΒΧ για να αλλάξεις τη χρήση.</p>
  <div class="tbl"><table><thead><tr><th>Χώρος</th><th style="padding-left:8px">Χρήση</th><th style="padding-left:8px">Καθαρό</th><th style="padding-left:8px">Ε9</th></tr></thead><tbody>${body}</tbody>
  <tfoot><tr><td>Κύριοι χώροι (ΚΧ)</td><td></td><td></td><td>${fmt(E.T.kyr)}</td></tr><tr><td>Βοηθητικοί χώροι (ΒΧ)</td><td></td><td></td><td>${fmt(E.T.voith)}</td></tr>
  <tr><td>ΚΧ + ΒΧ</td><td></td><td></td><td>${fmt(E.sum)}</td></tr><tr><td>Μικτό ορόφου</td><td></td><td></td><td>${fmt(E.foot)}</td></tr>
  <tr><td>Διαφορά</td><td></td><td></td><td style="color:var(--${ok?'ok':'warn'})">${d>0?'+':''}${fmt(d)}</td></tr>
  ${E.T.imiy>0?`<tr><td>Ημιυπαίθριοι (καθαρό)</td><td></td><td></td><td>${fmt(E.T.imiy)}</td></tr>`:''}${E.T.exo>0?`<tr><td>Εξώστες (καθαρό)</td><td></td><td></td><td>${fmt(E.T.exo)}</td></tr>`:''}</tfoot></table></div>
  ${ok?'':'<p style="font-size:12px;color:var(--warn)">Η διαφορά βγαίνει συνήθως από καμινάδες, κενά ανάμεσα σε χώρους ή τοίχους που δεν ακουμπούν σε χώρο. Δες τα στην κάτοψη.</p>'}
  <div class="actions"><button class="btn ${KT.e9?'on':''}" id="ktE9">${KT.e9?'Κρύψε τα Ε9 από την κάτοψη':'Δείξε τα Ε9 στην κάτοψη'}</button></div>`; }
function ktE9Bind(){ side.querySelectorAll('.kU').forEach(b=>b.onclick=e=>{ e.stopPropagation(); const r=roomById(+b.dataset.u); if(!r) return; snap(); r.use=useOf(r)==='kyr'?'voith':'kyr'; commit(); });

function ktDrawE9(){ if(!KT.e9) return; const E=ktE9(); ctx.save();
  for(const x of E.rooms){ if(x.u!=='kyr'&&x.u!=='voith') continue; const col=x.u==='kyr'?colors.accent:colors.warn;
    ctx.fillStyle=col; ctx.globalAlpha=0.16; polyPath(x.polys); ctx.fill('evenodd'); ctx.globalAlpha=0.9; ctx.strokeStyle=col; ctx.lineWidth=1.5; ctx.setLineDash([6,3]); polyPath(x.polys); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha=1;
    const o=OL[x.room.id]; if(!o||!o.polys.length) continue; let big=o.polys[0]; for(const p of o.polys) if(p.area>big.area) big=p; let c=centroid(big[0]); if(!inPolys(c,o.polys)) c=big[0][0]; const s=W2S(c);

  ctx.restore(); }

// ---------- μέτρηση χώρου → εσωτερικοί τοίχοι (ιεραρχία: εξωτερικός > έτοιμοι χώροι > τοίχοι) ----------
const WM_DT=0.05, WM_TMIN=0.08, WM_TMAX=0.60;
function wmRoomOk(id){ return !!wmOn()&&roomItems(id).some(i=>isShape(i)&&i.src&&i.src.k==='walls'); }
function wmSides(id){ const C=roomCorners(id), n=C.length; return C.map((p,i)=>{ const q=C[(i+1)%n], L=Math.hypot(q[0]-p[0],q[1]-p[1])||1; return {a:p,b:q,L,u:[(q[0]-p[0])/L,(q[1]-p[1])/L],m:[(p[0]+q[0])/2,(p[1]+q[1])/2]}; }); }
function wmOutN(id,s){ let n=[-s.u[1],s.u[0]]; if(inPolys([s.m[0]+n[0]*0.01,s.m[1]+n[1]*0.01],OL[id].polys)) n=[-n[0],-n[1]]; return n; }
function wmMatch(sides,ms){ let best=-1, bd=1e9; sides.forEach((s,i)=>{ if(Math.abs(s.u[0]*ms.u[1]-s.u[1]*ms.u[0])>0.01) return;

function wmMeasMap(id){ const room=roomById(id), Sd=wmSides(id), out={}; for(const ms of (room&&room.ms)||[]){ const i=wmMatch(Sd,ms); if(i>=0) out[i]=ms.m; } return out; }

  return Object.keys(M).map(i=>{ i=+i; const diff=Math.abs(M[i]-Sd[i].L); return {lbl:'Πλευρά '+corner(i)+corner((i+1)%n),meas:M[i],calc:Sd[i].L,diff,lvl:lvlOf(diff)}; }); }
// δοκιμάζει: ολόκληρος ο τοίχος στην άκρη της πλευράς μετακινείται (ο διπλανός χώρος αλλάζει),
// αλλιώς μόνο η παρειά του (αλλάζει το πάχος, έως ±5 εκ.). Ποτέ ο εξωτερικός, ποτέ έτοιμος χώρος, ποτέ άλλη μετρημένη πλευρά.

  const delta=v-s.L; if(Math.abs(delta)<0.003){ snap(); return finish(true,'same'); }
  const before=S.rooms.length, locked=S.rooms.filter(r=>r.id!==id&&r.wz).map(r=>[r.id,OL[r.id]?OL[r.id].area:0]);
  const cands=[]; let ext=0, lockHit=0;
  for(const j of [(i+1)%n,(i-1+n)%n]){ const e=Sd[j], o=wmOutN(id,e), w=wmHit([e.m[0]+o[0]*0.02,e.m[1]+o[1]*0.02]); if(!w){ ext++; continue; }
    const sin=Math.abs(s.u[0]*e.u[1]-s.u[1]*e.u[0]); if(sin<0.2) continue; cands.push({id:w.id,o,d:delta*sin,face:false},{id:w.id,o,d:delta*sin,face:true}); }
  const good=()=>{ compute(); if(S.rooms.length<before) return false; for(const [rid,a] of locked){ if(!OL[rid]||Math.abs(OL[rid].area-a)>0.003){ lockHit++; return false; } }
    const Sd2=wmSides(id); for(const ms of msOld){ const k=wmMatch(Sd2,ms); if(k>=0&&Math.abs(Sd2[k].L-ms.m)>0.004) return false; }
